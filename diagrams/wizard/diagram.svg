<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" font-family="'Noto Sans SC', -apple-system, sans-serif">
  <rect width="1400" height="1020" fill="#fafbfc"/>

  <text x="40" y="38" font-size="22" font-weight="700" fill="#1a2733">New Agent · 4 步向导</text>
  <text x="40" y="60" font-size="12" fill="#5c6b78">每一步的数据来源：Step 1/2 来自 session-provider registry；Step 4 来自 cronymax.chat.tool 注册列表</text>

  <!-- Step 1: top-left -->
  <g id="step1">
    <rect x="40" y="90" width="660" height="430" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="40" y="90" width="660" height="40" rx="12" fill="#f6f8fa"/>
    <rect x="40" y="120" width="660" height="10" fill="#f6f8fa"/>
    <rect x="56" y="102" width="32" height="22" rx="11" fill="#2c8390"/>
    <text x="72" y="118" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="100" y="116" font-size="13" font-weight="600" fill="#1a2733">Step 1/4 · 选择会话提供者</text>

    <text x="64" y="166" font-size="13" font-weight="700" fill="#1a2733">这一步：列出所有已注册的 cronymax.chat.session-provider</text>

    <!-- Native option -->
    <rect x="64" y="190" width="600" height="58" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="84" cy="219" r="9" fill="none" stroke="#5c6b78" stroke-width="1.5"/>
    <text x="108" y="217" font-size="14" font-weight="700" fill="#1a2733">Native</text>
    <text x="108" y="236" font-size="11" fill="#5c6b78">cronymax 内置（Anthropic / OpenAI / Ollama / Copilot）</text>

    <!-- Coco option (selected) -->
    <rect x="64" y="258" width="600" height="58" rx="6" fill="#e8f4f6" stroke="#2c8390" stroke-width="2"/>
    <circle cx="84" cy="287" r="9" fill="#2c8390" stroke="#2c8390" stroke-width="1.5"/>
    <circle cx="84" cy="287" r="4" fill="#ffffff"/>
    <text x="108" y="285" font-size="14" font-weight="700" fill="#1f5a64">Coco</text>
    <text x="108" y="304" font-size="11" fill="#3d6f78">bytedance.coco · ByteDance Coco via ACP</text>

    <!-- Other -->
    <rect x="64" y="326" width="600" height="58" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="84" cy="355" r="9" fill="none" stroke="#5c6b78" stroke-width="1.5"/>
    <text x="108" y="353" font-size="14" font-weight="700" fill="#1a2733">…其他第三方已装 session-provider 扩展</text>
    <text x="108" y="372" font-size="11" fill="#5c6b78">来源：registry.list("cronymax.chat.session-provider")</text>

    <!-- Buttons -->
    <rect x="450" y="478" width="100" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="500" y="498" font-size="12" fill="#5c6b78" text-anchor="middle">取消</text>
    <rect x="560" y="478" width="120" height="32" rx="6" fill="#2c8390" stroke="#1f6e7a"/>
    <text x="620" y="498" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">下一步 →</text>
  </g>

  <!-- Step 2: top-right -->
  <g id="step2">
    <rect x="720" y="90" width="660" height="430" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="720" y="90" width="660" height="40" rx="12" fill="#f6f8fa"/>
    <rect x="720" y="120" width="660" height="10" fill="#f6f8fa"/>
    <rect x="736" y="102" width="32" height="22" rx="11" fill="#2c8390"/>
    <text x="752" y="118" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="780" y="116" font-size="13" font-weight="600" fill="#1a2733">Step 2/4 · 选择模型与模式</text>

    <text x="744" y="166" font-size="13" font-weight="700" fill="#1a2733">这一步：从 provider.listModels() + provider.modes 拿数据</text>

    <!-- Model dropdown -->
    <text x="744" y="200" font-size="12" font-weight="600" fill="#3a4a55">模型</text>
    <rect x="744" y="208" width="600" height="44" rx="6" fill="#ffffff" stroke="#2c8390" stroke-width="1.5"/>
    <text x="760" y="226" font-size="13" font-weight="700" fill="#1a2733">GPT-5.4</text>
    <text x="760" y="244" font-size="10" fill="#5c6b78">Context 240k · Max tool turns: 200</text>
    <text x="1328" y="234" font-size="14" fill="#2c8390" text-anchor="end">▾</text>

    <!-- Dropdown options preview -->
    <rect x="744" y="258" width="600" height="86" rx="6" fill="#f8f9fa" stroke="#d0d7de"/>
    <text x="760" y="278" font-size="11" fill="#3a4a55">GPT-5.4     Context 240k</text>
    <text x="760" y="296" font-size="11" fill="#3a4a55">Doubao-Seed-Code     Context 184k</text>
    <text x="760" y="314" font-size="11" fill="#3a4a55">Kimi-K2.6     Context 184k</text>
    <text x="760" y="332" font-size="11" fill="#3a4a55">DeepSeek-V4-Pro     Context 184k</text>

    <!-- Mode dropdown -->
    <text x="744" y="376" font-size="12" font-weight="600" fill="#3a4a55">默认模式</text>
    <rect x="744" y="384" width="600" height="38" rx="6" fill="#ffffff" stroke="#2c8390" stroke-width="1.5"/>
    <text x="760" y="408" font-size="13" font-weight="700" fill="#1a2733">Plan</text>
    <text x="1328" y="408" font-size="14" fill="#2c8390" text-anchor="end">▾</text>

    <text x="744" y="438" font-size="10" fill="#5c6b78">来自 provider.modes: default · plan · bypass_permissions</text>

    <!-- Buttons -->
    <rect x="1130" y="478" width="100" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="1180" y="498" font-size="12" fill="#5c6b78" text-anchor="middle">← 上一步</text>
    <rect x="1240" y="478" width="120" height="32" rx="6" fill="#2c8390" stroke="#1f6e7a"/>
    <text x="1300" y="498" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">下一步 →</text>
  </g>

  <!-- Step 3: bottom-left -->
  <g id="step3">
    <rect x="40" y="540" width="660" height="430" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="40" y="540" width="660" height="40" rx="12" fill="#f6f8fa"/>
    <rect x="40" y="570" width="660" height="10" fill="#f6f8fa"/>
    <rect x="56" y="552" width="32" height="22" rx="11" fill="#2c8390"/>
    <text x="72" y="568" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="100" y="566" font-size="13" font-weight="600" fill="#1a2733">Step 3/4 · 配置人格</text>

    <text x="64" y="616" font-size="13" font-weight="700" fill="#1a2733">这一步：写入到 .cronymax/agents/&lt;id&gt;.agent.yaml 的平台级字段</text>

    <text x="64" y="650" font-size="11" font-weight="600" fill="#3a4a55">名称*</text>
    <rect x="64" y="658" width="600" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="76" y="678" font-size="12" fill="#1a2733">Code Reviewer</text>

    <text x="64" y="708" font-size="11" font-weight="600" fill="#3a4a55">描述</text>
    <rect x="64" y="716" width="600" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="76" y="736" font-size="12" fill="#1a2733">Reviews PRs for code quality</text>

    <text x="64" y="766" font-size="11" font-weight="600" fill="#3a4a55">图标</text>
    <rect x="64" y="774" width="160" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="76" y="794" font-size="12" font-family="monospace" fill="#1a2733">$(check)</text>

    <text x="64" y="824" font-size="11" font-weight="600" fill="#3a4a55">System Prompt *</text>
    <rect x="64" y="832" width="600" height="100" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="76" y="852" font-size="11" fill="#1a2733">You are a senior code reviewer. Be terse and direct.</text>
    <text x="76" y="868" font-size="11" fill="#1a2733">Focus on correctness, security, and performance.</text>
    <text x="76" y="884" font-size="11" fill="#1a2733">…</text>
    <text x="652" y="922" font-size="10" fill="#5c6b78" text-anchor="end">支持模板变量</text>

    <!-- Buttons -->
    <rect x="450" y="950" width="100" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="500" y="970" font-size="12" fill="#5c6b78" text-anchor="middle">← 上一步</text>
    <rect x="560" y="950" width="120" height="32" rx="6" fill="#2c8390" stroke="#1f6e7a"/>
    <text x="620" y="970" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">下一步 →</text>
  </g>

  <!-- Step 4: bottom-right -->
  <g id="step4">
    <rect x="720" y="540" width="660" height="430" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="720" y="540" width="660" height="40" rx="12" fill="#f6f8fa"/>
    <rect x="720" y="570" width="660" height="10" fill="#f6f8fa"/>
    <rect x="736" y="552" width="32" height="22" rx="11" fill="#2c8390"/>
    <text x="752" y="568" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="780" y="566" font-size="13" font-weight="600" fill="#1a2733">Step 4/4 · 工具与 MCP</text>

    <text x="744" y="616" font-size="13" font-weight="700" fill="#1a2733">这一步：tool 列表来自所有已注册 cronymax.chat.tool EP</text>

    <text x="744" y="646" font-size="11" font-weight="600" fill="#3a4a55">允许的工具</text>
    <g id="tools">
      <rect x="744" y="656" width="600" height="22" rx="3" fill="#ffffff"/>
      <rect x="748" y="660" width="14" height="14" rx="2" fill="#2c8390"/>
      <text x="754" y="672" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="772" y="672" font-size="11" fill="#1a2733">cronymax.tool.shell</text>
      <text x="1340" y="672" font-size="10" fill="#7d8a96" text-anchor="end">(cronymax 内置)</text>

      <rect x="748" y="684" width="14" height="14" rx="2" fill="#2c8390"/>
      <text x="754" y="696" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="772" y="696" font-size="11" fill="#1a2733">cronymax.tool.fs.read</text>
      <text x="1340" y="696" font-size="10" fill="#7d8a96" text-anchor="end">(cronymax 内置)</text>

      <rect x="748" y="708" width="14" height="14" rx="2" fill="#ffffff" stroke="#7d8a96"/>
      <text x="772" y="720" font-size="11" fill="#3a4a55">cronymax.tool.fs.write</text>
      <text x="1340" y="720" font-size="10" fill="#7d8a96" text-anchor="end">(cronymax 内置)</text>

      <rect x="748" y="732" width="14" height="14" rx="2" fill="#2c8390"/>
      <text x="754" y="744" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="772" y="744" font-size="11" fill="#1a2733">github.review.*</text>
      <text x="1340" y="744" font-size="10" fill="#7d8a96" text-anchor="end">(来自 acme.github)</text>

      <rect x="748" y="756" width="14" height="14" rx="2" fill="#ffffff" stroke="#7d8a96"/>
      <text x="772" y="768" font-size="11" fill="#3a4a55">python.run</text>
      <text x="1340" y="768" font-size="10" fill="#7d8a96" text-anchor="end">(来自 acme.python-tool)</text>
    </g>

    <text x="744" y="800" font-size="11" font-weight="600" fill="#3a4a55">MCP Servers</text>
    <rect x="744" y="810" width="600" height="62" rx="5" fill="#fff4d6" stroke="#c9a341"/>
    <text x="756" y="830" font-size="11" font-weight="600" fill="#7a5b10">─ github  ✕</text>
    <text x="756" y="848" font-size="10" font-family="monospace" fill="#7a5b10">  Config: { "token_secret_ref": "bytedance.github.token" }</text>
    <text x="756" y="866" font-size="10" fill="#7a5b10">  [+ Add MCP Server]</text>

    <text x="744" y="900" font-size="11" font-weight="600" fill="#3a4a55">选项</text>
    <rect x="748" y="908" width="14" height="14" rx="2" fill="#2c8390"/>
    <text x="754" y="920" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="772" y="920" font-size="11" fill="#1a2733">Auto compact</text>
    <text x="1000" y="920" font-size="11" fill="#1a2733">Max turns: [30]</text>

    <!-- Buttons -->
    <rect x="1130" y="950" width="100" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="1180" y="970" font-size="12" fill="#5c6b78" text-anchor="middle">← 上一步</text>
    <rect x="1240" y="950" width="120" height="32" rx="6" fill="#9c2a3a" stroke="#7a1f2c"/>
    <text x="1300" y="970" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">完成 ✓</text>
  </g>

  <!-- Connector arrows between steps -->
  <g id="connectors">
    <!-- 1 → 2 -->
    <polyline points="700,290 712,290" fill="none" stroke="#2c8390" stroke-width="2"/>
    <polygon points="720,290 708,284 708,296" fill="#2c8390"/>
    <!-- 2 → 3 (top-right to bottom-left) -->
    <polyline points="1050,520 1050,535 350,535 350,540" fill="none" stroke="#2c8390" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="350,540 344,528 356,528" fill="#2c8390"/>
    <!-- 3 → 4 -->
    <polyline points="700,755 712,755" fill="none" stroke="#2c8390" stroke-width="2"/>
    <polygon points="720,755 708,749 708,761" fill="#2c8390"/>
  </g>

  <text x="40" y="1004" font-size="11" fill="#5c6b78">完成后写入 .cronymax/agents/&lt;auto-id&gt;.agent.yaml · 触发事件 cronymax.flow.agent.created</text>
</svg>
