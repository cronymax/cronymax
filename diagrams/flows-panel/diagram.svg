<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Noto Sans SC', -apple-system, sans-serif">
  <rect width="1100" height="580" fill="#fafbfc"/>

  <text x="40" y="38" font-size="20" font-weight="700" fill="#1a2733">Flows · Agents 标签</text>
  <text x="40" y="58" font-size="12" fill="#5c6b78">UI mockup · 列出所有 agent 配置 · 显示绑定的 session-provider 与模型</text>

  <!-- Window frame -->
  <rect x="60" y="86" width="980" height="464" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Window header bar -->
  <rect x="60" y="86" width="980" height="46" rx="12" fill="#f6f8fa"/>
  <rect x="60" y="118" width="980" height="14" fill="#f6f8fa"/>
  <circle cx="84" cy="109" r="6" fill="#ff5f56"/>
  <circle cx="104" cy="109" r="6" fill="#ffbd2e"/>
  <circle cx="124" cy="109" r="6" fill="#27c93f"/>
  <text x="550" y="114" font-size="13" font-weight="600" fill="#1a2733" text-anchor="middle">Flows</text>

  <!-- + New Agent button -->
  <rect x="908" y="98" width="118" height="28" rx="6" fill="#2c8390" stroke="#1f6e7a" stroke-width="1"/>
  <text x="967" y="116" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">+ New Agent</text>

  <!-- Tab bar -->
  <g id="tabs">
    <rect x="76" y="148" width="100" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="126" y="168" font-size="12" fill="#5c6b78" text-anchor="middle">Flows</text>

    <rect x="180" y="148" width="100" height="32" rx="5" fill="#e8f4f6" stroke="#2c8390" stroke-width="1.5"/>
    <text x="230" y="168" font-size="12" font-weight="700" fill="#1f5a64" text-anchor="middle">Agents</text>
    <rect x="180" y="178" width="100" height="3" fill="#2c8390"/>

    <rect x="284" y="148" width="100" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="334" y="168" font-size="12" fill="#5c6b78" text-anchor="middle">History</text>

    <rect x="388" y="148" width="100" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="438" y="168" font-size="12" fill="#5c6b78" text-anchor="middle">Settings</text>
  </g>

  <!-- Agent list -->
  <g id="agents">
    <!-- Row 1: Code Reviewer -->
    <rect x="76" y="206" width="948" height="92" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <circle cx="120" cy="252" r="22" fill="#e8f4f6" stroke="#2c8390" stroke-width="1.5"/>
    <text x="120" y="258" font-size="20" fill="#2c8390" text-anchor="middle">✓</text>
    <text x="160" y="240" font-size="15" font-weight="700" fill="#1a2733">Code Reviewer</text>
    <text x="160" y="262" font-size="12" fill="#5c6b78">Reviews PRs for code quality</text>
    <text x="160" y="282" font-size="11" fill="#7d8a96">system prompt · 3 tools · MCP: github</text>
    <rect x="710" y="222" width="180" height="26" rx="4" fill="#fff4d6" stroke="#c9a341" stroke-width="1"/>
    <text x="800" y="240" font-size="11" font-weight="600" fill="#7a5b10" text-anchor="middle">coco · GPT-5.4 · plan</text>
    <text x="970" y="280" font-size="11" fill="#5c6b78" text-anchor="end">edit · delete</text>

    <!-- Row 2: Meeting Notes -->
    <rect x="76" y="312" width="948" height="92" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <circle cx="120" cy="358" r="22" fill="#e8f4f6" stroke="#2c8390" stroke-width="1.5"/>
    <text x="120" y="364" font-size="16" fill="#2c8390" text-anchor="middle">📝</text>
    <text x="160" y="346" font-size="15" font-weight="700" fill="#1a2733">Meeting Notes</text>
    <text x="160" y="368" font-size="12" fill="#5c6b78">Summarizes meeting transcripts</text>
    <text x="160" y="388" font-size="11" fill="#7d8a96">system prompt · 1 tool</text>
    <rect x="710" y="328" width="180" height="26" rx="4" fill="#e8f4f6" stroke="#5a99a4" stroke-width="1"/>
    <text x="800" y="346" font-size="11" font-weight="600" fill="#1f5a64" text-anchor="middle">native · Claude-Opus-4.7</text>
    <text x="970" y="386" font-size="11" fill="#5c6b78" text-anchor="end">edit · delete</text>

    <!-- Row 3: Research Assistant -->
    <rect x="76" y="418" width="948" height="92" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <circle cx="120" cy="464" r="22" fill="#e8f4f6" stroke="#2c8390" stroke-width="1.5"/>
    <text x="120" y="470" font-size="16" fill="#2c8390" text-anchor="middle">🔬</text>
    <text x="160" y="452" font-size="15" font-weight="700" fill="#1a2733">Research Assistant</text>
    <text x="160" y="474" font-size="12" fill="#5c6b78">Deep research with web tools</text>
    <text x="160" y="494" font-size="11" fill="#7d8a96">system prompt · 5 tools · MCP: web-search, fetch</text>
    <rect x="710" y="434" width="180" height="26" rx="4" fill="#fff4d6" stroke="#c9a341" stroke-width="1"/>
    <text x="800" y="452" font-size="11" font-weight="600" fill="#7a5b10" text-anchor="middle">coco · Doubao-Seed-Code</text>
    <text x="970" y="492" font-size="11" fill="#5c6b78" text-anchor="end">edit · delete</text>
  </g>

  <!-- 注释 -->
  <text x="60" y="566" font-size="11" fill="#5c6b78">每行右上角色块标示 session-provider · 模型 · mode；同一 provider 可被多个 agent 引用</text>
</svg>
