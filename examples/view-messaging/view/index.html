<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Messaging</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0;
        height: 100%;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #1f2328;
        /* No background: the platform injects the content-surface color. */
      }
      @media (prefers-color-scheme: dark) {
        html, body { color: #e6e6ea; }
      }
      .wrap { box-sizing: border-box; padding: 24px; max-width: 720px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 16px; opacity: 0.8; }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(127, 127, 127, 0.15); }
      .log {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.1);
        white-space: pre-wrap;
        min-height: 1.5em;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>View Messaging</h1>
      <p>
        A platform-opened operation view with full two-way messaging. The
        extension host registered a <code>WebviewViewProvider</code>; it
        greets this view on resolve and echoes whatever we send.
      </p>
      <button id="ping">Send a ping to the extension</button>
      <div class="log" id="log">Acquiring API…</div>
    </div>
    <script>
      const log = document.getElementById("log");
      const lines = [];
      function append(line) {
        lines.push(line);
        if (lines.length > 12) lines.shift();
        log.textContent = lines.join("\n");
      }

      let api = null;
      try {
        api = acquireCronymaxApi();
        api.onDidReceiveMessage((msg) => {
          append("ext → view: " + JSON.stringify(msg));
        });
        append("Acquired cronymax API. Waiting for the host…");
      } catch (e) {
        append("acquireCronymaxApi unavailable: " + e);
      }

      document.getElementById("ping").addEventListener("click", () => {
        if (!api) {
          append("No API handle.");
          return;
        }
        const payload = { type: "ping", at: Date.now() };
        api.postMessage(payload);
        append("view → ext: " + JSON.stringify(payload));
      });
    </script>
  </body>
</html>
